# Dev reverse proxy: API/admin/static -> Django, everything else -> Vite (with HMR).
upstream backend  { server backend:8000; }
upstream frontend { server frontend:5173; }

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m;

    location /api/   { proxy_pass http://backend; include /etc/nginx/conf.d/proxy.inc; }
    location /admin/ { proxy_pass http://backend; include /etc/nginx/conf.d/proxy.inc; }
    location /static/ { proxy_pass http://backend; include /etc/nginx/conf.d/proxy.inc; }

    # Vite dev server + WebSocket HMR.
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
