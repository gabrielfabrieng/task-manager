# Production gateway: static SPA + API proxy, with baseline security headers.
upstream backend  { server backend:8000; }
upstream frontend { server frontend:80; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Defence-in-depth headers (backend also sets its own in prod settings).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/    { proxy_pass http://backend;  include /etc/nginx/conf.d/proxy.inc; }
    location /admin/  { proxy_pass http://backend;  include /etc/nginx/conf.d/proxy.inc; }
    location /static/ { proxy_pass http://backend;  include /etc/nginx/conf.d/proxy.inc; }

    location / { proxy_pass http://frontend; include /etc/nginx/conf.d/proxy.inc; }
}
