name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, type, test, security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: |
          black --check .
          isort --check-only .
          flake8 .
      - name: Type check
        run: mypy .
      - name: Tests (coverage gate 85%)
        run: pytest
      - name: Security scan (bandit)
        run: bandit -r apps config -ll
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt
        continue-on-error: true

  frontend:
    name: Frontend — lint, type, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E — Selenium through the full stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/login >/dev/null; then
              echo "app ready"; exit 0
            fi
            echo "waiting ($i)…"; sleep 3
          done
          echo "app did not become ready"; docker compose logs; exit 1
      - name: Run E2E
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
